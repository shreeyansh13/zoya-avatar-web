<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoya AI - 3D Avatar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #11111a; /* डार्क बैकग्राउंड */
            font-family: Arial, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            /* यहाँ CSS से ज़ूम और नीचे शिफ्ट किया गया है */
            transform: scale(1.35) translateY(12%);
            transform-origin: top center; /* ऊपर से ज़ूम होकर नीचे आएगा */
            transition: transform 0.5s ease;
        }

        /* UI के बटन (जैसे आपकी स्क्रीनशॉट में हैं) */
        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .chat-box {
            background: rgba(30, 30, 45, 0.9);
            border: 1px solid #333;
            color: white;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }

        .button-row {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: #7b61ff;
            color: white;
        }

        .btn-secondary {
            background-color: #2a2a35;
            color: white;
        }
    </style>
</head>
<body>

    <!-- 3D अवतार यहाँ लोड होगा -->
    <div id="canvas-container"></div>

    <!-- नीचे का UI (सिर्फ डिज़ाइन के लिए) -->
    <div class="ui-container">
        <div class="chat-box">
            नमस्ते ज़ोया, आज की तारीख क्या है?
        </div>
        <div class="button-row">
            <button class="btn btn-primary">💬 पूछें और सुनें</button>
            <button class="btn btn-secondary">⏹️ रोकें</button>
        </div>
        <div class="button-row">
            <button class="btn btn-secondary">🎵 मौलिक धुन</button>
            <button class="btn btn-secondary">🎶 गुनगुनाएँ</button>
        </div>
    </div>

    <!-- Three.js और GLTFLoader (3D मॉडल लोड करने के लिए) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // 1. Scene, Camera, Renderer सेटअप
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.2, 3); // कैमरा पोज़िशन

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // 2. लाइटिंग सेटअप (अवतार चमकदार दिखेगा)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(1, 2, 3);
        scene.add(directionalLight);

        // 3. 3D मॉडल लोड करना (VRM या GLB)
        const loader = new GLTFLoader();
        // VRM मॉडल सपोर्ट के लिए प्लगइन (अगर आप .vrm फाइल यूज़ कर रहे हैं)
        loader.register((parser) => new VRMLoaderPlugin(parser));

        // ⚠️ यहाँ अपनी मॉडल फाइल का पाथ डालें! 
        // उदाहरण: 'models/zoya.vrm' या 'models/avatar.glb'
        const modelURL = 'models/your_avatar_model.vrm'; 

        loader.load(
            modelURL,
            (gltf) => {
                const model = gltf.scene;
                scene.add(model);

                // अगर VRM मॉडल है, तो उसे सही से सेट करें
                if (gltf.userData.vrm) {
                    const vrm = gltf.userData.vrm;
                    VRMUtils.removeUnnecessaryVertices(gltf.scene);
                    VRMUtils.combineSkeletons(gltf.scene);
                    VRMUtils.rotateVRM0(vrm);
                    
                    // मॉडल को स्क्रीन के सेंटर में लाना
                    model.position.y = 0; 
                }
            },
            (progress) => {
                console.log('लोड हो रहा है: ' + (progress.loaded / progress.total * 100) + '%');
            },
            (error) => {
                console.error('मॉडल लोड करने में एरर:', error);
                // अगर मॉडल नहीं मिला, तो टेस्टिंग के लिए एक क्यूब दिखाएं
                const geometry = new THREE.BoxGeometry(1, 1.5, 0.5);
                const material = new THREE.MeshStandardMaterial({ color: 0xff9999 });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.y = 0.75;
                scene.add(cube);
            }
        );

        // 4. एनिमेशन लूप
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            // अगर आपको मॉडल में हिलना-डुलना (Idle animation) चाहिए तो यहाँ करें

            renderer.render(scene, camera);
        }
        animate();

        // 5. स्क्रीन रीसाइज़ होने पर एडजस्ट करना
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
