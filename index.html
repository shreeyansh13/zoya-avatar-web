<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoya AI - 3D Avatar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #181824;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .chat-box {
            background: #232330;
            border: 1px solid #3a3a4a;
            color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .button-row {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.7; }
        .btn-primary { background-color: #7b61ff; color: white; }
        .btn-secondary { background-color: #2a2a35; color: white; border: 1px solid #3a3a4a; }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="loading">अवतार लोड हो रहा है...</div>
    <div id="canvas-container"></div>

    <div class="ui-container">
        <div class="chat-box">
            नमस्ते ज़ोया, आज की तारीख क्या है?
        </div>
        <div class="button-row">
            <button class="btn btn-primary">💬 पूछें और सुनें</button>
            <button class="btn btn-secondary">⏹️ रोकें</button>
        </div>
        <div class="button-row">
            <button class="btn btn-secondary">🎵 मौलिक धुन</button>
            <button class="btn btn-secondary">🎶 गुनगुनाएँ</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // 🔥 1. कैमरा सेटिंग्स (Passport Size के लिए) 🔥
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
        
        // Z की वैल्यू कम करने से ज़ूम इन होता है। Y की वैल्यू से कैमरा ऊपर/नीचे होता है।
        camera.position.set(0, 1.35, 1.6); // कैमरा पास (1.6) और चेहरे के लेवल पर (1.35)
        camera.lookAt(0, 1.2, 0); // कैमरा सीधे सीने/चेहरे के बीच देखेगा

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // लाइटिंग
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(1, 2, 3);
        scene.add(directionalLight);

        // मॉडल लोडर
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));

        // ⚠️ यहाँ अपना असली मॉडल डालें (जैसे 'zoya.vrm')
        const modelURL = 'https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm'; 

        let currentVrm = null;

        loader.load(
            modelURL,
            (gltf) => {
                document.getElementById('loading').style.display = 'none';
                const model = gltf.scene;
                scene.add(model);

                if (gltf.userData.vrm) {
                    const vrm = gltf.userData.vrm;
                    currentVrm = vrm;
                    
                    VRMUtils.removeUnnecessaryVertices(gltf.scene);
                    VRMUtils.combineSkeletons(gltf.scene);
                    VRMUtils.rotateVRM0(vrm);

                    // 🔥 2. हाथों को छाती पर लाने का कोड (Bone Rotation) 🔥
                    // हम मॉडल की हड्डियों (Bones) को घुमा रहे हैं
                    const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                    const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                    const leftLowerArm = vrm.humanoid.getNormalizedBoneNode('leftLowerArm');
                    const rightLowerArm = vrm.humanoid.getNormalizedBoneNode('rightLowerArm');

                    if (leftUpperArm && rightUpperArm) {
                        // कंधों को नीचे लाना
                        leftUpperArm.rotation.z = 1.3; 
                        rightUpperArm.rotation.z = -1.3; 
                        
                        // कोहनी को मोड़ना ताकि हाथ छाती पर आएं
                        if (leftLowerArm && rightLowerArm) {
                            leftLowerArm.rotation.y = -1.2; 
                            rightLowerArm.rotation.y = 1.2;
                        }
                    }
                }
            },
            (progress) => {
                console.log('लोड हो रहा है: ' + Math.round((progress.loaded / progress.total) * 100) + '%');
            },
            (error) => {
                console.error('मॉडल लोड करने में एरर:', error);
                document.getElementById('loading').innerText = "मॉडल लोड नहीं हो पाया!";
            }
        );

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // VRM को अपडेट करना ज़रूरी है ताकि हाथों की नई पोज़िशन दिखे
            if (currentVrm) {
                currentVrm.update(delta);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
