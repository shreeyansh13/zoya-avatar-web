<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoya AI - 3D Avatar</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #13131c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        /* बैकग्राउंड में एक सॉफ्ट सा ग्रेडिएंट ताकि सिनेमैटिक लुक आए */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: radial-gradient(circle at center, #1e1e2b 0%, #0a0a0f 100%); }
        
        .ui-container { position: absolute; bottom: 15px; left: 0; width: 100%; padding: 0 15px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .chat-box { background: rgba(35, 35, 48, 0.85); backdrop-filter: blur(5px); border: 1px solid #3a3a4a; color: #ffffff; padding: 15px; border-radius: 12px; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .button-row { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 14px 10px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity 0.2s; }
        .btn:active { opacity: 0.7; }
        .btn-primary { background-color: #7b61ff; color: white; }
        .btn-secondary { background-color: #2a2a35; color: white; border: 1px solid #3a3a4a; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 18px; z-index: 5; }
    </style>
</head>
<body>
    <div id="loading">अवतार लोड हो रहा है...</div>
    <div id="canvas-container"></div>

    <div class="ui-container">
        <div class="chat-box">नमस्ते ज़ोया, आज की तारीख क्या है?</div>
        <div class="button-row">
            <button class="btn btn-primary">💬 पूछें और सुनें</button>
            <button class="btn btn-secondary">⏹️ रोकें</button>
        </div>
        <div class="button-row">
            <button class="btn btn-secondary">🎵 मौलिक धुन</button>
            <button class="btn btn-secondary">🎶 गुनगुनाएँ</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // 1. सिनेमैटिक कैमरा (आपकी दूसरी इमेज जैसा फ्रेम)
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.15, 2.8); // कैमरा थोड़ा दूर और सीधा
        camera.lookAt(0, 1.0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        // टोन मैपिंग (रंगों को सॉफ्ट और रियलिस्टिक बनाने के लिए)
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // 2. सॉफ्ट लाइटिंग (चेहरा सफेद न दिखे इसके लिए)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const frontLight = new THREE.DirectionalLight(0xffeedd, 1.0);
        frontLight.position.set(0, 2, 5); // सामने से लाइट
        scene.add(frontLight);

        const fillLight = new THREE.DirectionalLight(0xaabbff, 0.5);
        fillLight.position.set(-2, 1, 2); // साइड से हल्की लाइट
        scene.add(fillLight);

        // 3. एक बेहतर चेयर का 3D मॉडल (कोड से)
        const chairGroup = new THREE.Group();
        const chairMat = new THREE.MeshStandardMaterial({ color: 0x3a3a4a, roughness: 0.8 });
        const seatMat = new THREE.MeshStandardMaterial({ color: 0xdcdcdc, roughness: 0.9 }); // सॉफ्ट कुशन
        
        // चेयर की सीट
        const seat = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 0.8), seatMat);
        seat.position.y = 0.5;
        chairGroup.add(seat);
        
        // चेयर की पीठ
        const back = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.1), seatMat);
        back.position.set(0, 0.9, -0.35);
        chairGroup.add(back);

        // चेयर के पैर
        const legGeo = new THREE.BoxGeometry(0.1, 0.5, 0.1);
        const leg1 = new THREE.Mesh(legGeo, chairMat); leg1.position.set(0.35, 0.25, 0.35);
        const leg2 = new THREE.Mesh(legGeo, chairMat); leg2.position.set(-0.35, 0.25, 0.35);
        const leg3 = new THREE.Mesh(legGeo, chairMat); leg3.position.set(0.35, 0.25, -0.35);
        const leg4 = new THREE.Mesh(legGeo, chairMat); leg4.position.set(-0.35, 0.25, -0.35);
        chairGroup.add(leg1, leg2, leg3, leg4);
        
        // चेयर को सीन में जोड़ें (थोड़ा पीछे)
        chairGroup.position.z = -0.1;
        scene.add(chairGroup);

        // 4. मॉडल लोडर
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));

        // ⚠️ यहाँ अपना असली मॉडल डालें (जैसे 'zoya.vrm')
        const modelURL = 'https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm'; 

        let currentVrm = null;

        loader.load(
            modelURL,
            (gltf) => {
                document.getElementById('loading').style.display = 'none';
                const model = gltf.scene;
                scene.add(model);

                if (gltf.userData.vrm) {
                    const vrm = gltf.userData.vrm;
                    currentVrm = vrm;
                    
                    VRMUtils.removeUnnecessaryVertices(gltf.scene);
                    VRMUtils.combineSkeletons(gltf.scene);
                    VRMUtils.rotateVRM0(vrm);

                    // मॉडल को चेयर पर बैठाना
                    model.position.y = 0.15; // मॉडल को थोड़ा ऊपर उठाएं ताकि चेयर पर बैठे

                    // 🔥 पोज़ सेटिंग (हाथ गोद में और पैर सीधे) 🔥
                    const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                    const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                    const leftLowerArm = vrm.humanoid.getNormalizedBoneNode('leftLowerArm');
                    const rightLowerArm = vrm.humanoid.getNormalizedBoneNode('rightLowerArm');
                    
                    const leftUpperLeg = vrm.humanoid.getNormalizedBoneNode('leftUpperLeg');
                    const rightUpperLeg = vrm.humanoid.getNormalizedBoneNode('rightUpperLeg');

                    if (leftUpperArm && rightUpperArm) {
                        // हाथों को नीचे लाना (गोद में रखने के लिए)
                        leftUpperArm.rotation.z = 1.3; 
                        rightUpperArm.rotation.z = -1.3;
                        leftUpperArm.rotation.x = 0.2; 
                        rightUpperArm.rotation.x = 0.2;
                        
                        // कोहनी मोड़ना
                        if (leftLowerArm && rightLowerArm) {
                            leftLowerArm.rotation.y = -1.4; 
                            rightLowerArm.rotation.y = 1.4;
                            leftLowerArm.rotation.x = 0.4;
                            rightLowerArm.rotation.x = 0.4;
                        }
                    }

                    // पैरों को बैठने की पोज़ में लाना
                    if (leftUpperLeg && rightUpperLeg) {
                        leftUpperLeg.rotation.x = -1.4; // जांघ को 90 डिग्री मोड़ना
                        rightUpperLeg.rotation.x = -1.4;
                        
                        // पैरों को थोड़ा पास लाना
                        leftUpperLeg.rotation.z = -0.05;
                        rightUpperLeg.rotation.z = 0.05;
                    }
                }
            },
            (progress) => console.log('लोड हो रहा है: ' + Math.round((progress.loaded / progress.total) * 100) + '%'),
            (error) => {
                console.error('मॉडल लोड करने में एरर:', error);
                document.getElementById('loading').innerText = "मॉडल लोड नहीं हो पाया!";
            }
        );

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (currentVrm) currentVrm.update(delta);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
