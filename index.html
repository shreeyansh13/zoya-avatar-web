<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <title>Zoya AI — Free Avatar</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      background: #101116;
      color: white;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px;
      font-size: 20px;
      font-weight: 700;
      border-bottom: 1px solid #30313a;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .portrait {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #181923;
    }

    .portrait img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* अनुमानित मुँह की जगह; फोटो के अनुसार समायोजन जरूरी हो सकता है */
    .mouth {
      position: absolute;
      left: 44.5%;
      top: 54.4%;
      width: 11%;
      height: 2.3%;
      border-radius: 50%;
      background: rgba(90, 12, 25, 0.18);
      transform: translate(-50%, -50%) scaleY(0.35);
      transform-origin: center;
      pointer-events: none;
    }

    .speaking .mouth {
      animation: talk 180ms infinite alternate ease-in-out;
    }

    @keyframes talk {
      from { transform: translate(-50%, -50%) scaleY(0.35); }
      to   { transform: translate(-50%, -50%) scaleY(2.1); }
    }

    textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      border: 1px solid #393b49;
      border-radius: 12px;
      padding: 12px;
      color: white;
      background: #1b1c25;
      font: inherit;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 13px 10px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    #speak { background: #7567ff; color: white; }
    #stop { background: #30313a; color: white; }

    #status {
      color: #c4c5d0;
      font-size: 14px;
      min-height: 22px;
    }

    footer {
      padding: 12px;
      text-align: center;
      color: #a7a8b3;
      font-size: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      .speaking .mouth { animation: none; }
    }
  </style>
</head>

<body>
  <header>ZOYA AI</header>

  <main>
    <div class="portrait" id="portrait">
      <img src="./avatar.png" alt="Zoya AI Assistant"
           onerror="document.getElementById('status').textContent='avatar.png नहीं मिली। GitHub में फ़ाइल का नाम और स्थान जाँचें।'">
      <div class="mouth"></div>
    </div>

    <textarea id="message"
      placeholder="यहाँ हिंदी में कुछ लिखें…">नमस्ते! मैं ज़ोया हूँ। बताइए, मैं आपकी क्या मदद कर सकती हूँ?</textarea>

    <div class="buttons">
      <button id="speak">🔊 बोलकर सुनाओ</button>
      <button id="stop">⏹ रोकें</button>
    </div>

    <div id="status" role="status">फोटो और आवाज़ का परीक्षण करने के लिए बटन दबाएँ।</div>
  </main>

  <footer>Zoya AI · Free Avatar Demo</footer>

  <script>
    const portrait = document.getElementById('portrait');
    const message = document.getElementById('message');
    const status = document.getElementById('status');
    const speakButton = document.getElementById('speak');

    function stopSpeaking() {
      window.speechSynthesis.cancel();
      portrait.classList.remove('speaking');
      speakButton.disabled = false;
    }

    speakButton.addEventListener('click', () => {
      const text = message.value.trim();

      if (!text) {
        status.textContent = 'पहले कुछ टेक्स्ट लिखें।';
        return;
      }

      if (!('speechSynthesis' in window)) {
        status.textContent = 'इस ब्राउज़र में टेक्स्ट-टू-स्पीच उपलब्ध नहीं है।';
        return;
      }

      stopSpeaking();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      utterance.rate = 0.92;

      utterance.onstart = () => {
        portrait.classList.add('speaking');
        speakButton.disabled = true;
        status.textContent = 'ज़ोया बोल रही है…';
      };

      utterance.onend = () => {
        portrait.classList.remove('speaking');
        speakButton.disabled = false;
        status.textContent = 'बोलना पूरा हुआ।';
      };

      utterance.onerror = () => {
        portrait.classList.remove('speaking');
        speakButton.disabled = false;
        status.textContent = 'आवाज़ नहीं चल पाई। दोबारा प्रयास करें।';
      };

      window.speechSynthesis.speak(utterance);
    });

    document.getElementById('stop').addEventListener('click', () => {
      stopSpeaking();
      status.textContent = 'आवाज़ रोक दी गई।';
    });
  </script>
</body>
</html>
