<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoya AI - 3D Avatar</title>
    <style>
        /* बेसिक सेटिंग */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #181824; /* डार्क बैकग्राउंड */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 3D अवतार का कंटेनर */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            
            /* 🔥 यहाँ ज़ूम और नीचे शिफ्ट करने का जादू है 🔥 */
            transform: scale(1.45) translateY(12%); 
            transform-origin: top center; 
        }

        /* नीचे का UI (चैट और बटन) */
        .ui-container {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .chat-box {
            background: #232330;
            border: 1px solid #3a3a4a;
            color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .button-row {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn-primary {
            background-color: #7b61ff;
            color: white;
        }

        .btn-secondary {
            background-color: #2a2a35;
            color: white;
            border: 1px solid #3a3a4a;
        }
        
        /* लोडिंग इंडिकेटर */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="loading">अवतार लोड हो रहा है...</div>
    <div id="canvas-container"></div>

    <!-- UI सेक्शन -->
    <div class="ui-container">
        <div class="chat-box">
            नमस्ते ज़ोया, आज की तारीख क्या है?
        </div>
        <div class="button-row">
            <button class="btn btn-primary">💬 पूछें और सुनें</button>
            <button class="btn btn-secondary">⏹️ रोकें</button>
        </div>
        <div class="button-row">
            <button class="btn btn-secondary">🎵 मौलिक धुन</button>
            <button class="btn btn-secondary">🎶 गुनगुनाएँ</button>
        </div>
    </div>

    <!-- Three.js और VRM लोडर इम्पोर्ट -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // 1. सीन (Scene) सेटअप
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // कैमरा
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.2, 3); // कैमरा की पोज़िशन

        // रेंडरर
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // 2. लाइटिंग (अवतार को उजला दिखाने के लिए)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(1, 2, 3);
        scene.add(directionalLight);

        // 3. मॉडल लोड करना
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));

        // ⚠️ यहाँ अपनी असली 3D फाइल का नाम डालें (जैसे: 'zoya.vrm' या 'avatar.glb')
        // अभी के लिए मैंने इंटरनेट से एक टेस्ट मॉडल का लिंक डाला है ताकि स्क्रीन काली ना दिखे।
        const modelURL = 'https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm'; 

        loader.load(
            modelURL,
            (gltf) => {
                document.getElementById('loading').style.display = 'none'; // लोडिंग हटाएं
                
                const model = gltf.scene;
                scene.add(model);

                // VRM मॉडल सेटिंग्स
                if (gltf.userData.vrm) {
                    const vrm = gltf.userData.vrm;
                    VRMUtils.removeUnnecessaryVertices(gltf.scene);
                    VRMUtils.combineSkeletons(gltf.scene);
                    VRMUtils.rotateVRM0(vrm);
                }
            },
            (progress) => {
                console.log('लोड हो रहा है: ' + Math.round((progress.loaded / progress.total) * 100) + '%');
            },
            (error) => {
                console.error('मॉडल लोड करने में एरर:', error);
                document.getElementById('loading').innerText = "मॉडल लोड नहीं हो पाया!";
            }
        );

        // 4. एनिमेशन लूप (स्क्रीन को रेंडर करने के लिए)
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            // यहाँ आप आगे चलकर अवतार के हिलने-डुलने (Idle animation) का कोड जोड़ सकते हैं

            renderer.render(scene, camera);
        }
        animate();

        // 5. स्क्रीन साइज़ के हिसाब से एडजस्टमेंट
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
