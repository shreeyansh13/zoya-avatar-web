
<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>Zoya AI — Avatar</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #101116;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px;
      border-bottom: 1px solid #30313a;
      font-size: 20px;
      font-weight: 700;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .avatar {
      flex: 1;
      min-height: 55vh;
      border: 1px solid #30313a;
      border-radius: 18px;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: #191a22;
    }
    .avatar p { color: #c7c8d2; line-height: 1.6; }
    .status { color: #a9b8ff; font-size: 14px; }
    footer {
      padding: 14px 16px;
      text-align: center;
      color: #a7a8b3;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>Zoya AI</header>
  <main>
    <section class="avatar" aria-label="Zoya Avatar">
      <div>
        <h1>नमस्ते! मैं Zoya हूँ</h1>
        <p>आपकी महिला Avatar बातचीत स्क्रीन यहाँ तैयार होगी।</p>
        <p class="status">Avatar जोड़ने की तैयारी जारी है</p>
      </div>
    </section>
  </main>
  <footer>Zoya AI · Avatar Experience</footer>
</body>
</html>
