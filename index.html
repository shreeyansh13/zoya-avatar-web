<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101116">
<title>Zoya AI — Hindi Voice Preview</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;min-height:100dvh;background:#101116;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:14px 16px;font-size:20px;font-weight:700;border-bottom:1px solid #30313a}
main{width:100%;max-width:600px;margin:0 auto;padding:14px 16px 18px;flex:1;display:flex;flex-direction:column;gap:14px}
.portrait{position:relative;width:100%;height:clamp(320px,58dvh,560px);overflow:hidden;border-radius:18px;background:#181923;border:1px solid #30313a}
.portrait img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 24%}
textarea{width:100%;min-height:90px;resize:vertical;border:1px solid #393b49;border-radius:12px;padding:12px;color:white;background:#1b1c25;font:inherit}
.buttons{display:flex;gap:10px}
button{flex:1;padding:13px 10px;border:0;border-radius:12px;font:inherit;font-weight:650;cursor:pointer}
button:disabled{opacity:.65}
#speak{background:#7567ff;color:white}#stop{background:#30313a;color:white}
#status{color:#c4c5d0;font-size:14px;min-height:22px}
.note{color:#a7a8b3;font-size:12px;line-height:1.45}
footer{padding:12px;text-align:center;color:#a7a8b3;font-size:12px}
@media(min-width:520px){main{padding-top:20px}.portrait{height:520px}}
</style>
</head>
<body>
<header>ZOYA AI</header>
<main>
  <div class="portrait" id="portrait">
    <img id="avatar" src="./avatar.png" alt="Zoya AI Assistant"
      onerror="document.getElementById('status').textContent='avatar.png नहीं मिली। GitHub में फ़ाइल का नाम और स्थान जाँचें।'">
  </div>
  <textarea id="message" placeholder="यहाँ हिंदी में कुछ लिखें…">नमस्ते! मैं ज़ोया हूँ। बताइए, मैं आपकी क्या मदद कर सकती हूँ?</textarea>
  <div class="buttons"><button id="speak">🔊 बोलकर सुनाओ</button><button id="stop">⏹ रोकें</button></div>
  <div id="status" role="status">फोटो और हिंदी आवाज़ का परीक्षण करने के लिए बटन दबाएँ।</div>
  <div class="note">नोट: यह संस्करण Zoya की फोटो और ब्राउज़र की हिंदी आवाज़ दिखाता है। इसमें अभी वास्तविक 3D animation या audio-based lip-sync शामिल नहीं है।</div>
</main>
<footer>Zoya AI · Hindi Voice Preview</footer>
<script>
const message=document.getElementById('message');
const status=document.getElementById('status');
const speakButton=document.getElementById('speak');
let utterance=null;
function stopSpeaking(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  utterance=null;
  speakButton.disabled=false;
}
speakButton.addEventListener('click',()=>{
  const text=message.value.trim();
  if(!text){status.textContent='पहले कुछ टेक्स्ट लिखें।';return;}
  if(!('speechSynthesis' in window)){status.textContent='इस ब्राउज़र में टेक्स्ट-टू-स्पीच उपलब्ध नहीं है।';return;}
  stopSpeaking();
  utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='hi-IN';
  utterance.rate=.92;
  utterance.onstart=()=>{speakButton.disabled=true;status.textContent='ज़ोया बोल रही है…';};
  utterance.onend=()=>{speakButton.disabled=false;status.textContent='बोलना पूरा हुआ।';utterance=null;};
  utterance.onerror=()=>{speakButton.disabled=false;status.textContent='आवाज़ नहीं चल पाई। दोबारा प्रयास करें।';utterance=null;};
  window.speechSynthesis.speak(utterance);
});
document.getElementById('stop').addEventListener('click',()=>{
  stopSpeaking();
  status.textContent='आवाज़ रोक दी गई।';
});
window.addEventListener('pagehide',stopSpeaking);
</script>
</body>
</html>
