<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoya AI - 3D Avatar (Upgraded)</title>
    <style>
        /* --- CSS स्टाइलिंग (UI डिज़ाइन) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* हेडर */
        .header {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #e0e0e0;
            background: rgba(0, 0, 0, 0.3);
        }

        /* 3D मॉडल के लिए जगह */
        #canvas-container {
            flex: 1;
            position: relative;
            width: 100%;
        }

        /* नीचे का UI (चैट और बटन) */
        .ui-container {
            padding: 15px;
            background: #1e1e2f;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .chat-box {
            background: #2b2b3d;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            color: #f1f1f1;
            text-align: center;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background-color: #7b2cbf; /* पर्पल */
            color: white;
        }
        
        .btn-primary:hover { background-color: #9d4edd; }

        .btn-secondary {
            background-color: #33334d; /* डार्क */
            color: white;
        }
        .btn-secondary:hover { background-color: #44445c; }

        .btn-music {
            background-color: #2b2b3d;
            color: #a0a0a0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- हेडर -->
    <div class="header">Zoya AI - 3D Avatar</div>

    <!-- 3D मॉडल यहाँ दिखेगा -->
    <div id="canvas-container"></div>

    <!-- नीचे का UI -->
    <div class="ui-container">
        <div class="chat-box">
            नमस्ते ज़ोया, आज की तारीख क्या है?
        </div>
        
        <div class="btn-row">
            <button class="btn-primary" onclick="speak()">💬 पूछें और सुनें</button>
            <button class="btn-secondary" onclick="stop()">⏹️ रोकें</button>
        </div>
        
        <div class="btn-row">
            <button class="btn-music">🎵 मौलिक धुन</button>
            <button class="btn-music">🎶 गुनगुनाएँ</button>
        </div>
    </div>

    <!-- Three.js (3D लाइब्रेरी) इम्पोर्ट करना -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. सीन (Scene) सेटअप
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e); // डार्क बैकग्राउंड

        // 2. कैमरा सेटअप
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 3.5); // कैमरा मॉडल के करीब

        // 3. रेंडरर (स्क्रीन पर दिखाने के लिए)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 4. लाइटिंग (तस्वीर 2 जैसी सॉफ्ट लाइटिंग के लिए)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // मुख्य रोशनी
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
        directionalLight.position.set(2, 5, 3);
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0xa0c4ff, 1); // पीछे से नीली रोशनी
        backLight.position.set(-2, 3, -3);
        scene.add(backLight);

        // 5. माउस कंट्रोल (मॉडल को घुमाने के लिए)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2; // नीचे ज़मीन के अंदर न जाए
        controls.update();

        // 6. 3D मॉडल लोड करना
        const loader = new GLTFLoader();
        
        // ⚠️ ध्यान दें: यह एक डेमो 3D मॉडल है। 
        // आप अपनी खुद की हाई-क्वालिटी लड़की वाली .gltf या .vrm फाइल का लिंक यहाँ डाल सकते हैं।
        const modelURL = 'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb'; 
        
        loader.load(modelURL, function (gltf) {
            const model = gltf.scene;
            
            // मॉडल का साइज़ और पोज़िशन सेट करें
            model.position.set(0, 0, 0);
            model.scale.set(1, 1, 1);
            
            // अगर मॉडल में एनिमेशन है, तो उसे चलाएं
            if (gltf.animations && gltf.animations.length > 0) {
                const mixer = new THREE.AnimationMixer(model);
                const action = mixer.clipAction(gltf.animations[0]); // पहली एनिमेशन
                action.play();
                
                // एनिमेशन लूप
                const clock = new THREE.Clock();
                function animateModel() {
                    requestAnimationFrame(animateModel);
                    const delta = clock.getDelta();
                    mixer.update(delta);
                    renderer.render(scene, camera);
                }
                animateModel();
            } else {
                // अगर एनिमेशन नहीं है तो सिर्फ रेंडर करें
                renderer.render(scene, camera);
            }

            scene.add(model);
            console.log("3D मॉडल सफलतापूर्वक लोड हो गया!");

        }, undefined, function (error) {
            console.error("मॉडल लोड करने में एरर:", error);
        });

        // 7. एनिमेशन लूप
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // स्क्रीन साइज़ बदलने पर एडजस्ट करें
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 8. बटन्स के फंक्शन्स (डेमो के लिए)
        window.speak = function() {
            alert("ज़ोया सुन रही है... (यहाँ आप वॉइस रिकग्निशन कोड जोड़ सकते हैं)");
        };
        window.stop = function() {
            alert("ज़ोया रुक गई है।");
        };
    </script>
</body>
</html>
