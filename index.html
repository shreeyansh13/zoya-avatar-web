<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101116">
<title>Zoya AI — 3D Avatar</title>
<style>
*{box-sizing:border-box}:root{color-scheme:dark}
body{margin:0;background:#101116;color:#fff;font-family:system-ui,sans-serif;min-height:100dvh}
header{padding:14px 16px;font-size:20px;font-weight:750;border-bottom:1px solid #30313a}
main{max-width:680px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
#stage{height:clamp(370px,62dvh,620px);position:relative;overflow:hidden;border:1px solid #30313a;border-radius:18px;background:radial-gradient(ellipse at 50% 35%,#292a3b,#12131a 70%)}
#stage canvas{display:block;width:100%;height:100%}
#status{min-height:22px;color:#d0d0dc;font-size:14px;overflow-wrap:anywhere}
textarea{width:100%;min-height:92px;resize:vertical;border:1px solid #393b49;border-radius:12px;padding:12px;color:white;background:#1b1c25;font:inherit}
.buttons{display:flex;gap:10px}button{flex:1;padding:13px 10px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
#send{background:#7567ff;color:#fff}#stop{background:#30313a;color:#fff}button:disabled{opacity:.6}
.note{font-size:12px;line-height:1.5;color:#a7a8b3}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
  }
}
</script>
</head>
<body>
<header>ZOYA AI · 3D AVATAR</header>
<main>
  <section id="stage" aria-label="Zoya 3D avatar"></section>
  <textarea id="message" placeholder="अपना संदेश हिंदी में लिखें…">नमस्ते ज़ोया, आज की तारीख क्या है?</textarea>
  <div class="buttons"><button id="send">💬 पूछें और सुनें</button><button id="stop">⏹ रोकें</button></div>
  <div id="status" role="status">3D मॉड्यूल शुरू हो रहे हैं…</div>
  <div class="note">यह 3D VRM परीक्षण संस्करण है। मौजूदा Gemini /chat endpoint को ही कॉल करता है; backend और Call Flow नहीं बदलता। आवाज़ browser speech synthesis से आती है और उसके साथ अनुमानित mouth animation चलता है।</div>
</main>
<script type="module">
const statusEl=document.getElementById('status');
const stageEl=document.getElementById('stage');
const messageEl=document.getElementById('message');
const sendBtn=document.getElementById('send');
let THREE, GLTFLoader, VRMLoaderPlugin, VRMUtils;
let vrm=null,renderer=null,scene=null,camera=null,clock=null;
let utterance=null,speaking=false,mouthPhase=0,rafId=0;
let gesturePhase=0, gestureBlend=0, applyCrossedPose=()=>{};

function setStatus(message){statusEl.textContent=message;}
function stopVoice(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  speaking=false; utterance=null; sendBtn.disabled=false;
  if(vrm?.expressionManager) {
    for(const name of ['aa','ih','ou']) {
      try{vrm.expressionManager.setValue(name,0)}catch(_){}
    }
  }
}
function speak(text){
  if(!('speechSynthesis' in window)){setStatus('इस ब्राउज़र में आवाज़ उपलब्ध नहीं है। Chrome में खोलकर जाँचें।');sendBtn.disabled=false;return;}
  stopVoice();
  utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='hi-IN'; utterance.rate=.94; utterance.pitch=1.02;
  utterance.onstart=()=>{speaking=true;setStatus('ज़ोया बोल रही है…');};
  utterance.onend=()=>{speaking=false;setStatus('जवाब पूरा हुआ।');};
  utterance.onerror=(event)=>{speaking=false;sendBtn.disabled=false;setStatus('आवाज़ की त्रुटि: '+(event.error||'speech error'));};
  window.speechSynthesis.speak(utterance);
}
async function askBackend(userText){
  setStatus('Gemini से जवाब माँगा जा रहा है… पहली request में backend जागने के कारण थोड़ा समय लग सकता है।');
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 25000);
  let response;
  try {
    response = await fetch('https://zoya-backend-ctr8.onrender.com/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:userText}),
      signal: controller.signal
    });
  } catch (err) {
    if (err?.name === 'AbortError') {
      throw new Error('25 सेकंड में जवाब नहीं आया। Backend cold start या Gemini में देरी हो सकती है।');
    }
    throw err;
  } finally {
    clearTimeout(timeoutId);
  }
  if(!response.ok) throw new Error('Backend HTTP '+response.status);
  const data=await response.json();
  const answer=typeof data==='string'?data:
    (data.reply??data.response??data.answer??data.text??data.message??data.output);
  if(typeof answer!=='string'||!answer.trim()){
    throw new Error('Backend से जवाब मिला, लेकिन response format पहचाना नहीं गया।');
  }
  return answer.trim();
}
sendBtn.addEventListener('click',async()=>{
  const question=messageEl.value.trim();
  if(!question){setStatus('पहले संदेश लिखें।');return;}
  stopVoice(); sendBtn.disabled=true;
  try{
    const answer=await askBackend(question);
    messageEl.value=answer;
    speak(answer);
  }catch(error){
    const msg=error?.message||'अज्ञात नेटवर्क त्रुटि';
    if (error instanceof TypeError || /fetch|network|failed to fetch/i.test(msg)) {
      setStatus('AI कनेक्शन ब्लॉक हुआ: यह CORS/preflight या नेटवर्क समस्या लगती है। Backend health running होने पर भी backend को इस वेबसाइट के origin की अनुमति देनी होगी; frontend अकेले CORS bypass नहीं कर सकता।');
    } else {
      setStatus('Gemini कनेक्शन असफल: '+msg+'. Backend में कोई बदलाव नहीं किया गया।');
    }
  }finally{sendBtn.disabled=false;}
});
document.getElementById('stop').addEventListener('click',()=>{
  stopVoice();setStatus('आवाज़ रोक दी गई।');
});
window.addEventListener('pagehide',stopVoice);

function animate(){
  rafId=requestAnimationFrame(animate);
  if(!renderer||!scene||!camera)return;
  const delta=clock.getDelta();
  if(vrm){
    vrm.update(delta);
    const targetBlend = speaking ? 1 : 0;
    gestureBlend += (targetBlend - gestureBlend) * Math.min(1, delta * 3.5);
    
    if (speaking) gesturePhase += delta * 3.0;
    try{applyCrossedPose(gestureBlend, gesturePhase);}catch(_){}
    
    if(vrm.expressionManager){
      let amount=0;
      if(speaking){mouthPhase+=delta*14;amount=.12+Math.abs(Math.sin(mouthPhase))*.38;}
      try{vrm.expressionManager.setValue('aa',amount);}catch(_){}
    }
  }
  renderer.render(scene,camera);
}
function frameModel(model){
  model.updateMatrixWorld(true);
  const bounds=new THREE.Box3().setFromObject(model);
  const size=bounds.getSize(new THREE.Vector3());
  const center=bounds.getCenter(new THREE.Vector3());
  if(!Number.isFinite(size.y)||size.y<=0) throw new Error('मॉडल की ऊँचाई पढ़ नहीं पाई।');
  
  const scale=1.8/size.y;
  model.scale.setScalar(scale);
  model.position.x-=center.x*scale;
  model.position.y-=bounds.min.y*scale;
  model.position.z-=center.z*scale;
  model.updateMatrixWorld(true);
  
  // Camera framing: Head to navel, keeping avatar slightly lower on screen
  camera.position.set(0, 1.4, 2.4);
  camera.lookAt(0, 1.5, 0); 
  camera.updateProjectionMatrix();
}
async function init(){
  try{
    setStatus('3D libraries डाउनलोड हो रही हैं…');
    const imports=await Promise.all([
      import('three'),
      import('three/addons/loaders/GLTFLoader.js'),
      import('@pixiv/three-vrm')
    ]);
    [THREE,{GLTFLoader},{VRMLoaderPlugin,VRMUtils}]=imports;
    setStatus('3D renderer शुरू हो रहा है…');
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x171823);
    camera=new THREE.PerspectiveCamera(30,Math.max(1,stageEl.clientWidth)/Math.max(1,stageEl.clientHeight),.1,100);
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
    renderer.setSize(stageEl.clientWidth,stageEl.clientHeight);
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    stageEl.appendChild(renderer.domElement);
    
    scene.add(new THREE.HemisphereLight(0xffffff,0x62627b,1.5));
    const key=new THREE.DirectionalLight(0xffffff,1.8);key.position.set(1,2,3);scene.add(key);
    const fill=new THREE.DirectionalLight(0xa9b8ff,0.6);fill.position.set(-2,1,1);scene.add(fill);
    
    clock=new THREE.Clock();
    setStatus('models/sample_a.vrm डाउनलोड हो रहा है…');
    const loader=new GLTFLoader();
    loader.register(parser=>new VRMLoaderPlugin(parser));
    const gltf=await loader.loadAsync('./models/sample_a.vrm');
    vrm=gltf.userData.vrm;
    if(!vrm)throw new Error('फ़ाइल से VRM डेटा नहीं मिला।');
    if(VRMUtils && typeof VRMUtils.rotateVRM0==='function') VRMUtils.rotateVRM0(vrm);
    scene.add(vrm.scene);

    const bone = name => vrm.humanoid?.getNormalizedBoneNode(name);
    const poseBones = {
      leftUpper: bone('leftUpperArm'),
      rightUpper: bone('rightUpperArm'),
      leftLower: bone('leftLowerArm'),
      rightLower: bone('rightLowerArm'),
      leftHand: bone('leftHand'),
      rightHand: bone('rightHand')
    };

    const poseBase = {};
    for (const [key, node] of Object.entries(poseBones)) {
      if (node) poseBase[key] = node.quaternion.clone();
    }

    // EXACT VALUES FROM THE INFOGRAPHIC (Step 4: Hands touching in front of chest)
    const restAngles = {
      leftUpper:  [-0.4,  0.3,  1.1],
      rightUpper: [-0.4, -0.3, -1.1],
      leftLower:  [ 0.0,  1.0,  0.0],
      rightLower: [ 0.0, -1.0,  0.0],
      leftHand:   [ 0.0,  0.2,  0.0],
      rightHand:  [ 0.0, -0.2,  0.0]
    };

    applyCrossedPose = (blend = 0, phase = 0) => {
      const a = Math.sin(phase);
      const b = Math.sin(phase * 0.72 + 1.0);
      
      // EXACT GESTURE VALUES FROM THE INFOGRAPHIC (Expressive Gesture while speaking)
      const gestureAngles = {
        leftUpper:  [0.02 * a * blend, 0.02 * b * blend, 0.0],
        rightUpper: [0.02 * a * blend, -0.02 * b * blend, 0.0],
        leftLower:  [0.0, 0.1 * Math.sin(phase * 0.8) * blend, 0.0],
        rightLower: [0.0, -0.1 * Math.sin(phase * 0.9) * blend, 0.0],
        leftHand:   [0.0, 0.05 * a * blend, 0.0],
        rightHand:  [0.0, -0.05 * b * blend, 0.0]
      };

      for (const key of Object.keys(poseBones)) {
        const node = poseBones[key];
        const base = poseBase[key];
        if (!node || !base) continue;

        const rest = restAngles[key] || [0, 0, 0];
        const gesture = gestureAngles[key] || [0, 0, 0];
        const offset = new THREE.Quaternion().setFromEuler(
          new THREE.Euler(
            rest[0] + gesture[0],
            rest[1] + gesture[1],
            rest[2] + gesture[2],
            'XYZ'
          )
        );
        node.quaternion.copy(base).multiply(offset);
      }
    };

    applyCrossedPose(0, 0);

    frameModel(vrm.scene);
    setStatus('3D Avatar तैयार है। संदेश लिखकर “पूछें और सुनें” दबाएँ।');
    animate();
    window.addEventListener('resize',()=>{
      if(!renderer||!camera)return;
      camera.aspect=Math.max(1,stageEl.clientWidth)/Math.max(1,stageEl.clientHeight);
      camera.updateProjectionMatrix();
      renderer.setSize(stageEl.clientWidth,stageEl.clientHeight);
    });
  }catch(error){
    console.error('Zoya avatar initialization failed:',error);
    const message=error?.message||String(error);
    setStatus('लोडिंग त्रुटि: '+message+' (जाँचें: इंटरनेट/CDN, WebGL, और models/sample_a.vrm)');
  }
}
init();
</script>
</body>
</html>
