function chooseBehavior(text=''){

async function init(){const started=performance.now();showLoading('ज़ोया का 3D अवतार लोड हो रहा है…');setStatus('3D libraries डाउनलोड हो रही हैं…');loadingNoticeTimer=setTimeout(()=>{if(!vrm){showLoading('अवतार तैयार हो रहा है… पहली बार डाउनलोड में थोड़ा समय लग सकता है।');setStatus('3D लोडिंग जारी है…')}} ,5000);
