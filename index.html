<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101116"><title>Zoya AI — 3D Avatar</title>
<style>*{box-sizing:border-box}:root{color-scheme:dark}body{margin:0;background:#101116;color:#fff;font-family:system-ui,sans-serif;min-height:100dvh}header{padding:14px 16px;font-size:20px;font-weight:750;border-bottom:1px solid #30313a}main{max-width:680px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}#stage{height:clamp(370px,62dvh,620px);position:relative;overflow:hidden;border:1px solid #30313a;border-radius:18px;background:radial-gradient(ellipse at 50% 35%,#292a3b,#12131a 70%)}#stage canvas{display:block;width:100%;height:100%}#status{min-height:22px;color:#d0d0dc;font-size:14px}textarea{width:100%;min-height:92px;resize:vertical;border:1px solid #393b49;border-radius:12px;padding:12px;color:white;background:#1b1c25;font:inherit}.buttons{display:flex;gap:10px}button{flex:1;padding:13px 10px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}#send{background:#7567ff;color:#fff}#stop{background:#30313a;color:#fff}button:disabled{opacity:.6}.note{font-size:12px;line-height:1.5;color:#a7a8b3}</style>
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.166.1","three/addons/":"https://esm.sh/three@0.166.1/examples/jsm/","@pixiv/three-vrm":"https://esm.sh/@pixiv/three-vrm@3.2.1?external=three"}}</script></head>
<body><header>ZOYA AI · 3D AVATAR</header><main><section id="stage" aria-label="Zoya 3D avatar"></section><textarea id="message" placeholder="अपना संदेश हिंदी में लिखें…">नमस्ते! मैं ज़ोया हूँ। बताइए, मैं आपकी क्या मदद कर सकती हूँ?</textarea><div class="buttons"><button id="send">💬 पूछें और सुनें</button><button id="stop">⏹ रोकें</button></div><div id="status" role="status">3D मॉडल लोड हो रहा है…</div><div class="note">यह 3D VRM परीक्षण संस्करण है। Gemini के मौजूदा /chat endpoint को कॉल करता है; backend में कोई बदलाव नहीं करता। ब्राउज़र की आवाज़ के साथ mouth animation चलता है, लेकिन यह phoneme-accurate audio lip-sync नहीं है।</div></main>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
const stageEl=document.getElementById('stage'),statusEl=document.getElementById('status'),messageEl=document.getElementById('message'),sendBtn=document.getElementById('send');
let vrm=null,renderer,scene,camera,clock,utterance=null,speaking=false,mouthPhase=0;
function setStatus(s){statusEl.textContent=s;}
function stopVoice(){if('speechSynthesis'in window)window.speechSynthesis.cancel();speaking=false;utterance=null;sendBtn.disabled=false;if(vrm?.expressionManager){for(const n of ['aa','ih','ou'])try{vrm.expressionManager.setValue(n,0)}catch(e){}}}
function speak(text){if(!('speechSynthesis'in window)){setStatus('इस ब्राउज़र में आवाज़ उपलब्ध नहीं है।');return;}stopVoice();utterance=new SpeechSynthesisUtterance(text);utterance.lang='hi-IN';utterance.rate=.94;utterance.pitch=1.02;utterance.onstart=()=>{speaking=true;setStatus('ज़ोया बोल रही है…')};utterance.onend=()=>{speaking=false;setStatus('जवाब पूरा हुआ।')};utterance.onerror=()=>{speaking=false;setStatus('आवाज़ नहीं चल पाई; दोबारा प्रयास करें।')};window.speechSynthesis.speak(utterance)}
async function askBackend(userText){setStatus('Gemini से जवाब माँगा जा रहा है…');const r=await fetch('https://zoya-backend-ctr8.onrender.com/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:userText})});if(!r.ok)throw Error('Backend HTTP '+r.status);const d=await r.json();const a=typeof d==='string'?d:(d.reply??d.response??d.answer??d.text??d.message??d.output);if(typeof a!=='string'||!a.trim())throw Error('Gemini response format पहचान नहीं आया; मौजूदा backend schema verify करना होगा।');return a.trim()}
sendBtn.addEventListener('click',async()=>{const q=messageEl.value.trim();if(!q){setStatus('पहले संदेश लिखें।');return}stopVoice();sendBtn.disabled=true;try{const a=await askBackend(q);messageEl.value=a;speak(a)}catch(e){setStatus('Gemini कनेक्शन सफल नहीं हुआ: '+(e?.message||'नेटवर्क error')+'. Backend में कोई बदलाव नहीं किया गया।')}finally{sendBtn.disabled=false}});
document.getElementById('stop').addEventListener('click',()=>{stopVoice();setStatus('आवाज़ रोक दी गई।')});window.addEventListener('pagehide',stopVoice);
function animate(){requestAnimationFrame(animate);if(!renderer||!scene||!camera)return;const dt=clock.getDelta();if(vrm){vrm.update(dt);if(vrm.expressionManager){let v=0;if(speaking){mouthPhase+=dt*15;v=.18+Math.abs(Math.sin(mouthPhase))*.42}try{vrm.expressionManager.setValue('aa',v)}catch(e){}}}renderer.render(scene,camera)}
async function init(){try{scene=new THREE.Scene();scene.background=new THREE.Color(0x171823);camera=new THREE.PerspectiveCamera(28,stageEl.clientWidth/stageEl.clientHeight,.1,100);camera.position.set(0,1.22,4.45);camera.lookAt(0,1.12,0);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(stageEl.clientWidth,stageEl.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;stageEl.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x62627b,2));const key=new THREE.DirectionalLight(0xffffff,2.1);key.position.set(1,3,4);scene.add(key);const fill=new THREE.DirectionalLight(0xa9b8ff,.8);fill.position.set(-3,2,1);scene.add(fill);clock=new THREE.Clock();const loader=new GLTFLoader();loader.register(parser=>new VRMLoaderPlugin(parser));const gltf=await loader.loadAsync('./models/sample_a.vrm');vrm=gltf.userData.vrm;if(!vrm)throw Error('फ़ाइल से VRM डेटा नहीं मिला');VRMUtils.rotateVRM0(vrm);scene.add(vrm.scene);const box=new THREE.Box3().setFromObject(vrm.scene),h=box.max.y-box.min.y;if(h>0)vrm.scene.scale.setScalar(2/h);setStatus('3D Avatar तैयार है। संदेश लिखकर “पूछें और सुनें” दबाएँ।');animate();addEventListener('resize',()=>{camera.aspect=stageEl.clientWidth/stageEl.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stageEl.clientWidth,stageEl.clientHeight)})}catch(e){console.error(e);setStatus('3D मॉडल लोड नहीं हुआ: '+(e?.message||'नेटवर्क/VRM फ़ाइल जाँचें')+'. models/sample_a.vrm मौजूद होना चाहिए।')}}init();
</script></body></html>
