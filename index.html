<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoya AI - 3D Avatar</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f16 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        .ui-container { position: absolute; bottom: 15px; left: 0; width: 100%; padding: 0 15px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .chat-box { background: rgba(35, 35, 48, 0.85); backdrop-filter: blur(5px); border: 1px solid #3a3a4a; color: #ffffff; padding: 15px; border-radius: 12px; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .button-row { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 14px 10px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity 0.2s; }
        .btn:active { opacity: 0.7; }
        .btn-primary { background-color: #7b61ff; color: white; }
        .btn-secondary { background-color: #2a2a35; color: white; border: 1px solid #3a3a4a; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 18px; z-index: 5; }
    </style>
</head>
<body>
    <div id="loading">अवतार लोड हो रहा है...</div>
    <div id="canvas-container"></div>

    <div class="ui-container">
        <div class="chat-box">नमस्ते ज़ोया, आज की तारीख क्या है?</div>
        <div class="button-row">
            <button class="btn btn-primary">💬 पूछें और सुनें</button>
            <button class="btn btn-secondary">⏹️ रोकें</button>
        </div>
        <div class="button-row">
            <button class="btn btn-secondary">🎵 मौलिक धुन</button>
            <button class="btn btn-secondary">🎶 गुनगुनाएँ</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // 1. सिनेमैटिक कैमरा (Passport size, जैसा दूसरी इमेज में है)
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.1, 2.5); // कैमरा थोड़ा दूर
        camera.lookAt(0, 0.9, 0); // सीने/चेहरे पर फोकस

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        
        // 🔥 सफेद चेहरा रोकने के लिए टोन मैपिंग (सबसे जरुरी)
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        // 2. स्मूद और नेचुरल लाइटिंग
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); // बेस लाइट
        scene.add(ambientLight);
        
        const frontLight = new THREE.DirectionalLight(0xfff5e6, 0.8); // सॉफ्ट वार्म लाइट
        frontLight.position.set(0, 2, 3);
        scene.add(frontLight);

        const rimLight = new THREE.DirectionalLight(0x7b61ff, 0.5); // पीछे से हल्की नीली लाइट
        rimLight.position.set(0, 2, -3);
        scene.add(rimLight);

        // 3. एक साफ़-सुथरी चेयर (दूसरी इमेज जैसी)
        const chairGroup = new THREE.Group();
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a3b32, roughness: 0.7 }); // लकड़ी का रंग
        const cushionMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.9 }); // सफेद कुशन
        
        // सीट का कुशन
        const seat = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.15, 0.9), cushionMat);
        seat.position.y = 0.45;
        chairGroup.add(seat);
        
        // पीठ का कुशन
        const back = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.0, 0.15), cushionMat);
        back.position.set(0, 1.0, -0.4);
        chairGroup.add(back);

        // लकड़ी के आर्मरेस्ट
        const armGeo = new THREE.BoxGeometry(0.1, 0.1, 0.8);
        const armL = new THREE.Mesh(armGeo, woodMat); armL.position.set(-0.5, 0.7, 0); chairGroup.add(armL);
        const armR = new THREE.Mesh(armGeo, woodMat); armR.position.set(0.5, 0.7, 0); chairGroup.add(armR);
        
        // लकड़ी के पैर
        const legGeo = new THREE.BoxGeometry(0.1, 0.45, 0.1);
        const leg1 = new THREE.Mesh(legGeo, woodMat); leg1.position.set(0.4, 0.22, 0.4); chairGroup.add(leg1);
        const leg2 = new THREE.Mesh(legGeo, woodMat); leg2.position.set(-0.4, 0.22, 0.4); chairGroup.add(leg2);
        const leg3 = new THREE.Mesh(legGeo, woodMat); leg3.position.set(0.4, 0.22, -0.4); chairGroup.add(leg3);
        const leg4 = new THREE.Mesh(legGeo, woodMat); leg4.position.set(-0.4, 0.22, -0.4); chairGroup.add(leg4);
        
        scene.add(chairGroup);

        // 4. मॉडल लोडर
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));

        // ⚠️ यहाँ अपना असली 'zoya.vrm' फाइल का लिंक डालें!
        const modelURL = 'https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm'; 

        let currentVrm = null;

        loader.load(
            modelURL,
            (gltf) => {
                document.getElementById('loading').style.display = 'none';
                const model = gltf.scene;
                scene.add(model);

                if (gltf.userData.vrm) {
                    const vrm = gltf.userData.vrm;
                    currentVrm = vrm;
                    
                    VRMUtils.removeUnnecessaryVertices(gltf.scene);
                    VRMUtils.combineSkeletons(gltf.scene);
                    VRMUtils.rotateVRM0(vrm);

                    // 🔥 मॉडल को चेयर पर बैठाना
                    model.position.y = 0.15; 

                    // 🔥 5. परफेक्ट बैठने की पोज़ (Bones) 🔥
                    const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                    const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                    const leftLowerArm = vrm.humanoid.getNormalizedBoneNode('leftLowerArm');
                    const rightLowerArm = vrm.humanoid.getNormalizedBoneNode('rightLowerArm');
                    
                    const leftUpperLeg = vrm.humanoid.getNormalizedBoneNode('leftUpperLeg');
                    const rightUpperLeg = vrm.humanoid.getNormalizedBoneNode('rightUpperLeg');
                    const leftLowerLeg = vrm.humanoid.getNormalizedBoneNode('leftLowerLeg');
                    const rightLowerLeg = vrm.humanoid.getNormalizedBoneNode('rightLowerLeg');

                    // हाथों को गोद में रखना
                    if (leftUpperArm && rightUpperArm) {
                        leftUpperArm.rotation.z = 1.35; 
                        rightUpperArm.rotation.z = -1.35;
                        leftUpperArm.rotation.x = 0.2; 
                        rightUpperArm.rotation.x = 0.2;
                        
                        if (leftLowerArm && rightLowerArm) {
                            leftLowerArm.rotation.y = -1.3; 
                            rightLowerArm.rotation.y = 1.3;
                            leftLowerArm.rotation.x = 0.4;
                            rightLowerArm.rotation.x = 0.4;
                        }
                    }

                    // पैरों को 90 डिग्री पर मोड़ना (बैठने के लिए)
                    if (leftUpperLeg && rightUpperLeg) {
                        leftUpperLeg.rotation.x = -1.5; 
                        rightUpperLeg.rotation.x = -1.5;
                        
                        // घुटनों को थोड़ा पास लाना
                        leftUpperLeg.rotation.z = -0.05;
                        rightUpperLeg.rotation.z = 0.05;

                        // पिंडली को सीधा नीचे करना
                        if (leftLowerLeg && rightLowerLeg) {
                            leftLowerLeg.rotation.x = 1.5;
                            rightLowerLeg.rotation.x = 1.5;
                        }
                    }
                }
            },
            (progress) => console.log('लोड हो रहा है: ' + Math.round((progress.loaded / progress.total) * 100) + '%'),
            (error) => {
                console.error('मॉडल लोड करने में एरर:', error);
                document.getElementById('loading').innerText = "मॉडल लोड नहीं हो पाया!";
            }
        );

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (currentVrm) currentVrm.update(delta);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
