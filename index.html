<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101116">
<title>Zoya AI</title>

<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
  margin:0;background:#101116;color:#fff;
  font-family:system-ui,sans-serif;min-height:100dvh
}
header{
  padding:16px;font-size:22px;font-weight:750;
  border-bottom:1px solid #30313a
}
main{
  max-width:680px;margin:auto;padding:16px;
  display:flex;flex-direction:column;gap:14px
}
#answer{
  min-height:180px;padding:18px;border:1px solid #30313a;
  border-radius:16px;background:#1b1c25;
  white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7
}
textarea{
  width:100%;min-height:100px;resize:vertical;
  border:1px solid #393b49;border-radius:12px;
  padding:12px;color:white;background:#1b1c25;font:inherit
}
.buttons{display:flex;gap:10px}
button{
  flex:1;padding:13px 8px;border:0;border-radius:12px;
  font:inherit;font-weight:700;cursor:pointer
}
#send{background:#7567ff;color:white}
#stop{background:#30313a;color:white}
button:disabled{opacity:.6}
#status{min-height:24px;color:#d0d0dc;font-size:14px}
</style>
</head>

<body>
<header>ZOYA AI</header>

<main>
  <div id="answer" aria-live="polite">
    नमस्ते! मैं ज़ोया हूँ। बताइए, मैं आपकी क्या मदद करूँ?
  </div>

  <textarea id="message"
    placeholder="अपना संदेश हिंदी में लिखें…"></textarea>

  <div class="buttons">
    <button id="send">💬 पूछें और सुनें</button>
    <button id="stop">⏹ रोकें</button>
  </div>

  <div class="buttons">
    <button id="humOriginal">🎵 मौलिक धुन</button>
    <button id="humRequested">🎶 गुनगुनाएँ</button>
  </div>

  <div id="status" role="status">ज़ोया तैयार है।</div>
</main>

<script>
const statusEl = document.getElementById('status');
const answerEl = document.getElementById('answer');
const messageEl = document.getElementById('message');
const sendBtn = document.getElementById('send');

let utterance = null;
let audioCtx = null;
let melodyTimer = null;
let melodyNodes = [];
let requestController = null;
let requestId = 0;

function setStatus(text) {
  statusEl.textContent = text;
}

function stopVoice() {
  requestId++;

  if (requestController) {
    requestController.abort();
    requestController = null;
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }

  utterance = null;

  if (melodyTimer) {
    clearTimeout(melodyTimer);
    melodyTimer = null;
  }

  for (const node of melodyNodes) {
    try { node.stop?.(); } catch (_) {}
    try { node.disconnect?.(); } catch (_) {}
  }

  melodyNodes = [];
  sendBtn.disabled = false;
}

function speak(text, id) {
  if (!('speechSynthesis' in window)) {
    setStatus('आवाज़ उपलब्ध नहीं है। Chrome में जाँचें।');
    return;
  }

  utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'hi-IN';
  utterance.rate = 0.94;
  utterance.pitch = 1.02;

  utterance.onstart = () => {
    if (id !== requestId) return;
    setStatus('ज़ोया बोल रही है…');
  };

  utterance.onend = () => {
    if (id !== requestId) return;
    utterance = null;
    setStatus('जवाब पूरा हुआ।');
  };

  utterance.onerror = (event) => {
    if (id !== requestId) return;
    utterance = null;

    if (event.error !== 'canceled' &&
        event.error !== 'interrupted') {
      setStatus('आवाज़ की त्रुटि: ' + event.error);
    }
  };

  window.speechSynthesis.speak(utterance);
}

async function askBackend(userText, id) {
  const controller = new AbortController();
  requestController = controller;

  const timeoutId = setTimeout(
    () => controller.abort(), 25000
  );

  let response;

  try {
    response = await fetch(
      'https://zoya-backend-ctr8.onrender.com/chat',
      {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: userText}),
        signal: controller.signal
      }
    );
  } catch (error) {
    if (id !== requestId) return null;

    if (error.name === 'AbortError') {
      throw new Error(
        'समय पर जवाब नहीं आया। नेटवर्क या backend जाँचें।'
      );
    }

    throw new Error('AI कनेक्शन असफल। इंटरनेट जाँचें।');
  } finally {
    clearTimeout(timeoutId);
    if (requestController === controller) {
      requestController = null;
    }
  }

  if (id !== requestId) return null;

  if (!response.ok) {
    throw new Error('Backend HTTP ' + response.status);
  }

  const data = await response.json();

  const result = typeof data === 'string'
    ? data
    : (
        data.reply ??
        data.response ??
        data.answer ??
        data.text ??
        data.message ??
        data.output
      );

  if (typeof result !== 'string' || !result.trim()) {
    throw new Error('जवाब का प्रारूप समझ नहीं आया।');
  }

  return result.trim();
}

sendBtn.addEventListener('click', async () => {
  const question = messageEl.value.trim();

  if (!question) {
    setStatus('पहले अपना संदेश लिखें।');
    return;
  }

  stopVoice();
  const id = requestId;

  sendBtn.disabled = true;
  setStatus('Gemini से जवाब माँगा जा रहा है…');

  try {
    const result = await askBackend(question, id);

    if (id !== requestId || result === null) return;

    answerEl.textContent = result;
    speak(result, id);

  } catch (error) {
    if (id !== requestId) return;

    setStatus('AI कनेक्शन असफल: ' + error.message);
  } finally {
    if (id === requestId) {
      sendBtn.disabled = false;
    }
  }
});

document.getElementById('stop').addEventListener(
  'click', () => {
    stopVoice();
    setStatus('आवाज़ और चल रहा अनुरोध रोक दिया गया।');
  }
);

function playMelody(mode) {
  stopVoice();

  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) {
    setStatus('इस ब्राउज़र में धुन उपलब्ध नहीं है।');
    return;
  }

  audioCtx = audioCtx || new AudioContextClass();
  audioCtx.resume().catch(() => {});

  const original = [
    392,440,523.25,440,392,329.63,349.23,392
  ];

  const requested = [
    523.25,587.33,659.25,587.33,
    523.25,440,392,440
  ];

  const notes = mode === 'original'
    ? original : requested;

  const id = requestId;
  let index = 0;

  setStatus('ज़ोया धुन बजा रही है…');

  function playNote() {
    if (id !== requestId) return;

    const now = audioCtx.currentTime;
    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.type = 'sine';
    oscillator.frequency.value = notes[index % notes.length];

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.06, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.30);

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start(now);
    oscillator.stop(now + 0.32);

    melodyNodes.push(oscillator, gain);
    index++;

    melodyTimer = setTimeout(playNote, 360);
  }

  playNote();
}

document.getElementById('humOriginal').addEventListener(
  'click', () => playMelody('original')
);

document.getElementById('humRequested').addEventListener(
  'click', () => playMelody('requested')
);

window.addEventListener('pagehide', stopVoice);
</script>
</body>
</html>
